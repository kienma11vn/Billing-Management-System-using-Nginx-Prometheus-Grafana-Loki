name: sdm332_prod

networks:
  frontend-net:
    driver: bridge
  backend-net:
    driver: bridge
  monitoring-net:
    driver: bridge

volumes:
  sdm332_prod_postgres_data:
  sdm332_prod_pgadmin_data:
  sdm332_prod_grafana_data:
  sdm332_prod_loki_data:

services:
  # 1. Database PostgreSQL
  postgres:
    image: postgres:15-alpine
    container_name: sdm332_postgres
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - sdm332_prod_postgres_data:/var/lib/postgresql/data
      - ./postgres/init-exporter.sql:/docker-entrypoint-initdb.d/init-exporter.sql:ro
    networks:
      - backend-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. Database Management Tool (pgAdmin)
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: sdm332_pgadmin
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD}
      PGADMIN_CONFIG_ENFORCE_QUICK_CONFIG: "True"
      PGADMIN_CONFIG_PROXY_X_FORWARDED_FOR: "True"
      ENABLE_TLS: "False" # Giữ False vì Nginx đã đảm nhận TLS/SSL (SSL Termination)
    networks:
      - backend-net
      - frontend-net
    depends_on:
      - postgres

  # 3. Backend API (FastAPI)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sdm332_backend
    restart: always
    env_file:
      - ./.env
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - SECRET_KEY=${SECRET_KEY}
      - ALGORITHM=${ALGORITHM}
      - ACCESS_TOKEN_EXPIRE_MINUTES=${ACCESS_TOKEN_EXPIRE_MINUTES}
    networks:
      - backend-net
      - frontend-net
      - monitoring-net
    depends_on:
      postgres:
        condition: service_healthy
    command: >
      sh -c "alembic upgrade head &&
             python -m app.seed &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000"

  # 4. Frontend Client
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: sdm332_frontend
    restart: always
    networks:
      - frontend-net

  # Service hỗ trợ: Tự động sinh file .htpasswd từ file .env trước khi Nginx chạy
  htpasswd-gen:
    image: httpd:alpine
    container_name: sdm332_htpasswd_gen
    environment:
      PROMETHEUS_AUTH_USER: ${PROMETHEUS_AUTH_USER}
      PROMETHEUS_AUTH_PASS: ${PROMETHEUS_AUTH_PASS}
    volumes:
      - ./nginx:/etc/nginx/htpasswd_out
    command: >
      sh -c "htpasswd -bc /etc/nginx/htpasswd_out/.htpasswd $$PROMETHEUS_AUTH_USER $$PROMETHEUS_AUTH_PASS"

  # 5. Reverse Proxy Nginx
  nginx:
    image: nginx:alpine
    container_name: sdm332_nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
      - ./nginx/.htpasswd:/etc/nginx/.htpasswd:ro
    networks:
      - frontend-net
      - monitoring-net
    depends_on:
      htpasswd-gen:
        condition: service_completed_successfully # Đợi sinh xong file .htpasswd mới bật Nginx
      frontend:
        condition: service_started
      backend:
        condition: service_started
      pgadmin:
        condition: service_started

  # 6. Prometheus
  prometheus:
    image: prom/prometheus:latest
    container_name: sdm332_prometheus
    restart: always
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--web.external-url=/prometheus/'
      - '--web.route-prefix=/'
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    networks:
      - monitoring-net

  # 7. Grafana
  grafana:
    image: grafana/grafana:latest
    container_name: sdm332_grafana
    restart: always
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GF_SECURITY_ADMIN_PASSWORD}
      - GF_SERVER_ROOT_URL=${GF_SERVER_ROOT_URL}
      - GF_SERVER_SERVE_FROM_SUB_PATH=true
    volumes:
      - sdm332_prod_grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/grafana.ini:/etc/grafana/grafana.ini:ro
    networks:
      - monitoring-net
    depends_on:
      - prometheus

  # 8. Loki Logging
  loki:
    image: grafana/loki:2.9.0
    container_name: sdm332_loki
    restart: always
    user: "10001:10001" # Sử dụng UID/GID non-root
    command: -config.file=/etc/loki/loki-config.yml
    volumes:
      - ./logging/loki/loki-config.yml:/etc/loki/loki-config.yml:ro
      - sdm332_prod_loki_data:/loki
    networks:
      - monitoring-net

  # 9. Promtail Log Collector
  promtail:
    image: grafana/promtail:2.9.0
    container_name: sdm332_promtail
    restart: always
    volumes:
      - ./logging/promtail/promtail-config.yml:/etc/promtail/promtail-config.yml:ro
      - /var/log:/var/log:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    command: -config.file=/etc/promtail/promtail-config.yml
    networks:
      - monitoring-net
    depends_on:
      - loki
      
  # 10. cAdvisor - Thu thập Metrics từ Docker Containers
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    container_name: sdm332_cadvisor
    restart: always
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    networks:
      - monitoring-net

  # 11. Postgres Exporter - Thu thập Metrics từ PostgreSQL Database
  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:latest
    container_name: sdm332_postgres_exporter
    restart: always
    environment:
      DATA_SOURCE_NAME: "postgresql://${EXPORTER_USER}:${EXPORTER_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable" # Dùng User postgres_exporter với quyền read-only
    volumes:
      - ./monitoring/postgres_exporter/postgres_exporter.yml:/postgres_exporter.yml:ro
      - ./monitoring/postgres_exporter/queries.yaml:/etc/postgres_exporter/queries.yaml:ro
    command:
      - "--extend.query-path=/etc/postgres_exporter/queries.yaml"
    networks:
      - backend-net
      - monitoring-net
    depends_on:
      postgres:
        condition: service_healthy