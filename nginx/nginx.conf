events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Kích thước request tối đa (tránh lỗi 413 Payload Too Large khi upload file/dump DB)
    client_max_body_size 50M;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Content-Security-Policy "default-src 'self' http: https: data: blob: 'unsafe-inline' 'unsafe-eval'" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    upstream frontend_server {
        server frontend:80;
    }

    upstream backend_server {
        server backend:8000;
    }

    upstream pgadmin_server {
        server pgadmin:80;
    }

    # 1. Server Block HTTP (Cổng 80) -> Chuyển hướng toàn bộ 301 sang HTTPS
    server {
        listen 80;
        listen [::]:80;
        server_name _;

        return 301 https://$host$request_uri;
    }

    # 2. Server Block HTTPS (Cổng 443)
    server {
        listen 443 ssl;
        listen [::]:443 ssl;
        server_name _;

        # Khai báo đường dẫn SSL trong container
        ssl_certificate     /etc/nginx/certs/nginx.crt;
        ssl_certificate_key /etc/nginx/certs/nginx.key;

        # Cấu hình chuẩn mã hóa SSL/TLS
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;

        # Frontend Route (React/Client)
        location / {
            proxy_pass http://frontend_server;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }

        # Backend API Route (FastAPI)
        location /api/ {
            proxy_pass http://backend_server/api/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            
            # Timeout xử lý API
            proxy_read_timeout 300s;
            proxy_connect_timeout 300s;
        }

        # pgAdmin Route
        location /pgadmin/ {
            proxy_pass http://pgadmin_server/;
            proxy_http_version 1.1;
			# Hỗ trợ WebSocket
			proxy_set_header Upgrade $http_upgrade;
			proxy_set_header Connection "upgrade";

			# Các header nhận diện Proxy & Prefix path
            proxy_set_header X-Script-Name /pgadmin;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Scheme https;
			
			# Xử lý Cookie path & secure flag khi qua reverse proxy
			proxy_cookie_path / /pgadmin/;
            proxy_redirect off;
        }
		
		# Grafana Route
        location /grafana/ {
            proxy_pass http://grafana:3000;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }

        # Prometheus Route
        location /prometheus/ {
			# Bật xác thực Basic Auth
            auth_basic "Restricted Access to Prometheus";
            auth_basic_user_file /etc/nginx/.htpasswd;
		
            proxy_pass http://prometheus:9090/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }
    }
}