global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # 1. Giám sát chính Prometheus
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # 2. Giám sát Backend Web API (FastAPI)
  - job_name: 'backend_api'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['backend:8000']

  # 3. Giám sát các Containers (cAdvisor)
  - job_name: 'cadvisor'
    static_configs:
      - targets: ['cadvisor:8080']

  # 4. Giám sát Database PostgreSQL (Postgres Exporter)
  - job_name: 'postgres'
    static_configs:
      - targets: ['postgres-exporter:9187']