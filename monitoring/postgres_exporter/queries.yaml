# Cấu hình custom queries cho postgres_exporter
pg_database_size_bytes:
  query: "SELECT datname, pg_database_size(datname) AS bytes FROM pg_database WHERE datname NOT LIKE 'template%';"
  metrics:
    - datname:
        usage: "LABEL"
        description: "Tên database"
    - bytes:
        usage: "GAUGE"
        description: "Dung lượng database tính theo byte"

pg_stat_activity_counts:
  query: "SELECT state, count(*) AS total FROM pg_stat_activity WHERE state IS NOT NULL GROUP BY state;"
  metrics:
    - state:
        usage: "LABEL"
        description: "Trạng thái kết nối (active, idle, idle in transaction,...)"
    - total:
        usage: "GAUGE"
        description: "Số lượng kết nối tương ứng với từng trạng thái"